# Commands for this repo, for a maintainer at their own desk. CI runs the same
# commands written out in the Jenkinsfile instead, because a pull request can
# edit this file and `task` would run its copy — change both together.
#
# Everything here needs `rdmbench-cli` on PATH. That is deliberate: the tool
# that checks these tables is the same one that loads them on a bench, so
# there is no second implementation of the format to drift out of step. If you
# do not have it, open a pull request and CI will check for you.
#
# https://taskfile.dev

version: '3'

vars:
  CLI: '{{.CLI | default "rdmbench-cli"}}'
  TIMESTAMP_KEY_REF: '{{.TIMESTAMP_KEY_REF | default "op://RDMBench CI/RDMBench PID library timestamp key/password"}}'
  SIGNING_KEY_DOC: '{{.SIGNING_KEY_DOC | default "RDMBench PID library signing key"}}'
  SIGNING_KEY_VAULT: '{{.SIGNING_KEY_VAULT | default "RDMBench"}}'

tasks:
  default:
    cmds:
      - task: validate

  versions:
    desc: What the agent is running.
    cmds:
      - '{{.CLI}} --version'
      - git --version

  validate:
    desc: |
      Check every table: it loads, it is sourced, it stays inside the
      manufacturer-specific PID range, and it is where a bench would look;
      and every model file parses, is sourced and is the only one for its model.
      This is what gates a pull request.
    cmds:
      - '{{.CLI}} validate-tables tables'
      - '{{.CLI}} validate-models models'

  manifest:check:
    desc: |
      Verify tables/manifest.json against the tables and the model files, and
      its signature against the key RDMBench trusts. Run on main, not on a
      pull request — contributors do not regenerate the manifest, a
      maintainer does when merging.
    cmds:
      - '{{.CLI}} pid-manifest tables --check'

  manifest:
    desc: |
      Regenerate and sign tables/manifest.json, which covers models/ too (the
      sibling of tables/). Maintainers only, at merge time: the version
      moves only when a table or a model file changed, and a merge to main
      with a moved version and a fresh signature is what a release is. Reads
      the signing key from the login Keychain (`rdmbench-cli pid-key`),
      importing it from 1Password first on a Mac that lacks it (`key`).
    cmds:
      - task: key
      - '{{.CLI}} pid-manifest tables'
      # A new manifest needs a stamp naming it, or benches skip the
      # release until CI's daily run; the stamp's key comes from 1Password.
      - task: timestamp

  key:
    desc: |
      The library signing key into this Mac's login Keychain, from its backup
      in 1Password ("{{.SIGNING_KEY_DOC}}" in {{.SIGNING_KEY_VAULT}}),
      when it is not there; nothing when it is. The file exists only in a
      private temporary directory, deleted however the import ends. A new
      rdmbench-cli may ask once for the Keychain password (Always Allow).
    status:
      - '{{.CLI}} pid-key >/dev/null 2>&1'
    cmds:
      - |
        dir=$(mktemp -d)
        op document get "{{.SIGNING_KEY_DOC}}" --vault "{{.SIGNING_KEY_VAULT}}" --out-file "$dir/key" \
          && {{.CLI}} pid-key --import "$dir/key"
        status=$?
        rm -rf "$dir"
        exit $status
      # Says the public half and whether this build trusts it.
      - '{{.CLI}} pid-key'

  timestamp:check:
    desc: |
      Verify tables/timestamp.json: signed by the timestamp key RDMBench
      trusts, for the manifest beside it, and not expired. A bench refuses
      the library without one.
    cmds:
      - '{{.CLI}} pid-timestamp tables --check'

  site:
    desc: |
      Put this release on www.rdmbench.com/fixtures/: move rdmbench-site's
      pin to this repo's main, run the site's tests, commit and push, which
      deploys it. Run after the release is pushed; the site reads the library
      only at the commit go.mod pins, and nothing else moves it. Needs a
      checkout of rdmbench-site beside this one (SITE=… for another path),
      clean and on main. A quirk kind the site cannot describe fails its
      build here, before anything goes live: describe it in the site's
      layouts/_partials/fixtures/quirk.html.
    vars:
      SITE: '{{.SITE | default "../rdmbench-site"}}'
    silent: true
    cmds:
      - |
        set -e
        git fetch -q origin main
        test -z "$(git status --porcelain)" || { echo "rdmbench-pids has uncommitted changes"; exit 1; }
        test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "rdmbench-pids HEAD is not origin/main: push the release first"; exit 1; }
        commit=$(git rev-parse HEAD)
        version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' tables/manifest.json | head -1)
        cd "{{.SITE}}"
        test -z "$(git status --porcelain)" || { echo "{{.SITE}} has uncommitted changes"; exit 1; }
        test "$(git branch --show-current)" = main || { echo "{{.SITE}} is not on main"; exit 1; }
        git pull -q --ff-only
        node scripts/hugo.js mod get "github.com/darinpope/rdmbench-pids@$commit"
        if git diff --quiet go.mod go.sum; then
          echo "the site already pins $commit"
          exit 0
        fi
        npm test
        git add go.mod go.sum
        git commit -q -m "Fixtures: library $version" -m "rdmbench-pids $commit, by its task site."
        git push -q
        echo "rdmbench-site pins library $version ($commit); Workers Builds is deploying it"

  site:check:
    desc: |
      Whether www.rdmbench.com/fixtures/ shows this checkout's library
      version. Reads the live page, so it needs no access to rdmbench-site;
      the daily rdmbench/pids-timestamp job runs the same check. If it
      fails, run `task site`.
    silent: true
    cmds:
      - |
        want=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' tables/manifest.json | head -1)
        live=$(curl -fsS https://www.rdmbench.com/fixtures/index.md | sed -n 's/^- \*\*Library version:\*\* //p')
        if [ "$want" = "$live" ]; then
          echo "www.rdmbench.com/fixtures/ shows library $live"
        else
          echo "www.rdmbench.com/fixtures/ shows library ${live:-nothing}, not $want: run task site"
          exit 1
        fi

  timestamp:
    desc: |
      Sign tables/timestamp.json — that the manifest is current, for 30 days —
      if the manifest changed or the last stamp is a week old. CI runs this
      daily; by hand, it reads the key from 1Password, its only copy.
    cmds:
      - RDMBENCH_TIMESTAMP_KEY="$(op read '{{.TIMESTAMP_KEY_REF}}')" {{.CLI}} pid-timestamp tables
